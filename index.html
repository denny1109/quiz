<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đại đoàn kết – Quiz 15 giây</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1a33;--panel:#17264a;--ink:#f7f1e3;--mute:#a9b5d1;--red:#d7263d;--gold:#ffc83d;--teal:#27c2b5;--ok:#2fbf71;--bad:#ff5d6c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:520px;display:flex;align-items:flex-end;background:#000 center/cover no-repeat}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(14,26,51,.1) 0%,rgba(14,26,51,.92) 78%)}
.hero .in{position:relative;padding:28px 24px 28px}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;font-weight:900;margin:0 0 10px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--gold)}
.lead{color:#e6dfcc;margin:0 0 18px;max-width:46ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:4px 12px;font-size:.85rem}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:800;font-size:1.1rem;color:#2a1600;background:var(--gold);padding:14px 28px;border-radius:14px;box-shadow:0 5px 0 #b98a0f;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #b98a0f}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.btn.alt{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 #0a1226}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px;font-weight:600}
.score b{color:var(--gold);font-size:1.15rem}
.streak{color:var(--bad);font-weight:800;min-width:90px;text-align:right}
.bar{height:12px;border-radius:99px;background:#0a1226;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:100%;background:var(--teal);transform-origin:left;transition:background .3s}
.bar i.warn{background:var(--gold)}.bar i.danger{background:var(--red)}
.card{background:var(--panel);border-radius:22px;overflow:hidden}
.card img{display:block;width:100%;height:clamp(180px,38vw,300px);object-fit:cover;background:#0a1226}
.card .body{padding:18px 18px 20px}
.num{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:.9rem;margin-bottom:6px}
.clock{margin-left:auto;font-weight:900;font-size:1.6rem;color:var(--ink);font-variant-numeric:tabular-nums}
.q{font-size:clamp(1.05rem,3.4vw,1.3rem);font-weight:700;margin:0 0 14px;line-height:1.4}
.opts{display:grid;gap:10px}
@media(min-width:600px){.opts{grid-template-columns:1fr 1fr}}
.opt{appearance:none;text-align:left;font:inherit;color:var(--ink);background:#0e1a33;border:2px solid #2a3c6b;border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;background:#22356a;display:grid;place-items:center;font-weight:800;font-size:.9rem}
.opt.ok{background:rgba(47,191,113,.2);border-color:var(--ok)}.opt.ok .k{background:var(--ok);color:#062}
.opt.bad{background:rgba(255,93,108,.18);border-color:var(--bad)}.opt.bad .k{background:var(--bad);color:#300}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:12px 14px;border-radius:14px;background:#0e1a33;border-left:5px solid var(--gold);display:none}
.fb.show{display:block}
.fb strong{display:block;margin-bottom:2px}
.next{margin-top:14px;text-align:right;display:none}.next.show{display:block}
.end{text-align:center;padding:30px 20px}
.big{font-size:clamp(3rem,14vw,5.5rem);font-weight:900;color:var(--gold);line-height:1}
.rank{font-size:1.5rem;font-weight:800;margin:10px 0 4px}
.rev{display:grid;gap:6px;margin:18px 0;text-align:left}
.rev div{display:flex;gap:10px;background:#0e1a33;border-radius:10px;padding:8px 12px;font-size:.92rem}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{i:"8479",q:"Sân khấu rực rỡ cờ hoa của Tuần văn hóa – Đại đoàn kết các dân tộc. Theo Hồ Chí Minh, đại đoàn kết toàn dân tộc là…",o:["Chiêu trò tạm thời cho mùa lễ hội","Vấn đề chiến lược, quyết định thành bại của cách mạng","Việc riêng của một vài tổ chức","Khẩu hiệu đẹp để treo cho vui"],a:1,e:"Đại đoàn kết là đường lối chiến lược nhất quán, không phải sách lược nhất thời."},
{i:"8472",q:"Trên phông sân khấu có logo ngày 24-11. Đó là ngày gì?",o:["Ngày Nhà giáo Việt Nam","Ngày Văn hóa Việt Nam","Ngày Pháp luật Việt Nam","Ngày truyền thống Mặt trận Tổ quốc"],a:1,e:"24/11 gắn với Hội nghị Văn hóa toàn quốc lần thứ nhất năm 1946, nơi Chủ tịch Hồ Chí Minh đến dự và chỉ đạo."},

const T=15,$=id=>document.getElementById(id);
let n=0,score=0,streak=0,right=0,left=T,timer=null,locked=false,log=[];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(id){["start","play","end"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}
function start(){n=0;score=0;streak=0;right=0;log=[];$("sc").textContent=0;show("play");render()}
function render(){
  const c=Q[n];locked=false;
  $("pic").src=IMG[c.i];$("no").textContent="Câu "+(n+1)+"/"+Q.length;$("q").textContent=c.q;
  $("stk").textContent=streak>1?"Chuỗi "+streak+" câu đúng!":"";
  $("fb").className="fb";$("nx").className="next";
  const box=$("opts");box.innerHTML="";
  shuffle(c.o.map((t,i)=>({t,i}))).forEach((x,k)=>{
    const b=document.createElement("button");b.className="opt";b.dataset.i=x.i;
    b.innerHTML='<span class="k">'+"ABCD"[k]+'</span><span></span>';b.lastChild.textContent=x.t;
    b.onclick=()=>pick(x.i);box.appendChild(b)});
  left=T;tick();clearInterval(timer);const end=Date.now()+T*1000;
  timer=setInterval(()=>{left=Math.max(0,(end-Date.now())/1000);tick();if(left<=0)pick(-1)},100)
}
function tick(){
  $("clk").textContent=Math.ceil(left);const f=$("fill");
  f.style.transform="scaleX("+(left/T)+")";f.style.transition="none";
  f.className=left<=5?"danger":left<=9?"warn":""
}
function pick(i){
  if(locked)return;locked=true;clearInterval(timer);
  const c=Q[n],ok=i===c.a;
  document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.i;
    if(v===c.a)b.classList.add("ok");else if(v===i)b.classList.add("bad")});
  let msg;
  if(ok){streak++;right++;const p=100+Math.round(left*6)+(streak>1?20*Math.min(streak-1,5):0);score+=p;msg="Chính xác! +"+p+" điểm. "}
  else{streak=0;msg=i===-1?"Hết giờ rồi! ":"Tiếc quá! "}
  log.push({n:n+1,ok});
  $("sc").textContent=score;$("stk").textContent=streak>1?"Chuỗi "+streak+" câu đúng!":"";
  const fb=$("fb");fb.innerHTML="<strong></strong><span></span>";fb.firstChild.textContent=msg;fb.lastChild.textContent=c.e;fb.classList.add("show");
  $("nxb").textContent=n===Q.length-1?"Xem kết quả":"Câu tiếp theo";$("nx").classList.add("show");$("nxb").focus()
}
function next(){n++;if(n>=Q.length)finish();else render()}
function finish(){
  show("end");$("fs").textContent=score;
  const r=right,rank=r>=9?"Đại sứ đại đoàn kết":r>=7?"Chiến binh Mặt trận":r>=5?"Thành viên tích cực":r>=3?"Tân binh đang tập tành":"Cần ôn lại Chương 5 nhé";
  $("rk").textContent=rank;$("rd").textContent="Bạn đúng "+r+"/"+Q.length+" câu.";
  $("rev").innerHTML="";log.forEach(l=>{const d=document.createElement("div");d.textContent=(l.ok?"✔ ":"✘ ")+"Câu "+l.n;d.style.color=l.ok?"var(--ok)":"var(--bad)";$("rev").appendChild(d)})
}
$("go").onclick=start;$("again").onclick=start;$("nxb").onclick=next;
document.addEventListener("keydown",e=>{
  if(!$("play").classList.contains("hide")){
    const k="1234".indexOf(e.key);
    if(!locked&&k>-1){const b=document.querySelectorAll(".opt")[k];if(b)b.click()}
    else if(locked&&(e.key==="Enter"||e.key===" ")){e.preventDefault();next()}}
});
</script>
